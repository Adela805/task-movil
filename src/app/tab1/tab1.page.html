<ion-header>
  <ion-toolbar>
    <ion-title>📝 Mis Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- INPUT BONITO -->
  <ion-card>
    <ion-card-content>

      <ion-item lines="none">
        <ion-input [(ngModel)]="newTask" placeholder="Escribe una nueva tarea..."></ion-input>

        <ion-button slot="end" (click)="addTask()">
          Añadir
        </ion-button>

      </ion-item>

    </ion-card-content>
  </ion-card>

  <!-- TEXTO BONITO -->
  <ion-text color="medium">
    <p>Hoy tienes tareas pendientes 👇</p>
  </ion-text>

  <!-- LISTA DINÁMICA (IMPORTANTE) -->
  <ion-list>
    <ion-item *ngFor="let task of tasks">
      <ion-label>
        {{ task }}
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
