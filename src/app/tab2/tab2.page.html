<ion-header>
  <ion-toolbar>
    <ion-title>📊 Progreso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-content>
      <p>✔ Completadas: {{ doneCount }}</p>
      <p>⏳ Pendientes: {{ pendingCount }}</p>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-content>
      <p>Progreso general</p>
      <ion-progress-bar [value]="progress"></ion-progress-bar>
    </ion-card-content>
  </ion-card>

</ion-content>
