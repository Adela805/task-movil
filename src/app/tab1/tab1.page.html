<ion-header>
  <ion-toolbar>
    <ion-title>📝 Mis Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-content>

      <ion-item lines="none">
        <ion-input [(ngModel)]="newTask" placeholder="Tarea"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label>Fecha</ion-label>
        <ion-input type="date" [(ngModel)]="newDate"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label>Hora</ion-label>
        <ion-input type="time" [(ngModel)]="newTime"></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="addTask()">
        Añadir tarea
      </ion-button>

    </ion-card-content>
  </ion-card>

  <ion-list>
    <ion-item *ngFor="let task of tasks; let i = index">

      <ion-label>
        <h2 [style.text-decoration]="task.done ? 'line-through' : 'none'">
          {{ task.title }}
        </h2>
        <p>{{ task.date }} - {{ task.time }}</p>
      </ion-label>

      <ion-button (click)="toggleTask(i)">✔</ion-button>
      <ion-button color="danger" (click)="deleteTask(i)">🗑</ion-button>

    </ion-item>
  </ion-list>

</ion-content>
